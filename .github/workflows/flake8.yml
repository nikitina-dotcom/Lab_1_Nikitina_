name: Flake8 Lint

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "**.py"
      - ".flake8"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.x"

      - name: Install flake8
        run: pip install -r requirements.txt

      - name: Run flake8 with annotations
        run: |
          # Виведе читабельні повідомлення й «завалить» джоб при помилках
          flake8 .
