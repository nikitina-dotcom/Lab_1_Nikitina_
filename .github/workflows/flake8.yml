name: Flake8 Lint
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "**.py"
      - ".flake8"
      - "requirements.txt"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: flake8 .
